<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Genshin Impact Claw</title>
  <link rel="stylesheet" href="/app.css">
  <script src="/app.js" defer></script>
</head>
<body>
  <main class="page">
    <h1>Genshin Impact Claw</h1>

    <nav class="tabs" aria-label="Panel sections">
      <button class="tab-button active" data-tab="status" type="button">Status</button>
      <button class="tab-button" data-tab="logs" type="button">Logs</button>
      <button class="tab-button" data-tab="plugins" type="button">Plugins</button>
      <button class="tab-button" data-tab="config" type="button">Config</button>
    </nav>

    <section id="panel-status" class="tab-panel active">
      <div class="status-actions">
        <span id="run-status" class="badge idle">Idle</span>
        <button id="run-button" class="primary-button" type="button">Run Now</button>
      </div>
      <div id="last-run" class="card">
        <p class="muted">No runs yet</p>
      </div>
      <h2>Tasks</h2>
      <div id="task-list" class="task-list"></div>
    </section>

    <section id="panel-logs" class="tab-panel">
      <div id="log-container" class="card log-container" aria-live="polite"></div>
    </section>

    <section id="panel-plugins" class="tab-panel">
      <div id="plugin-list" class="card">
        <p class="muted">Loading plugins…</p>
      </div>
    </section>

    <section id="panel-config" class="tab-panel">
      <pre id="config-display" class="card config-display"></pre>
    </section>
  </main>
</body>
</html>
